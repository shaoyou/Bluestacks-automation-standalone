name: Package Windows Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package-windows-x64:
    name: Windows x64 package
    runs-on: windows-latest
    defaults:
      run:
        working-directory: electron_manager

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: electron_manager/package-lock.json

      - name: Install Electron dependencies
        run: npm ci

      - name: Set up Python for bundled runtime
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: x64

      - name: Build bundled automation runtime
        shell: pwsh
        run: |
          Set-ExecutionPolicy -ExecutionPolicy Bypass -Scope Process -Force
          $stdoutLog = "build-windows-runtime.stdout.log"
          $stderrLog = "build-windows-runtime.stderr.log"
          $script = (Resolve-Path "./scripts/build_windows_runtime.ps1").Path
          $process = Start-Process -FilePath "pwsh" -ArgumentList @("-NoProfile", "-ExecutionPolicy", "Bypass", "-File", $script, "-Python", "python") -NoNewWindow -Wait -PassThru -RedirectStandardOutput $stdoutLog -RedirectStandardError $stderrLog
          Get-Content $stdoutLog, $stderrLog | Set-Content build-windows-runtime.log
          Get-Content build-windows-runtime.log
          exit $process.ExitCode

      - name: Upload bundled runtime build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bs-manager-windows-runtime-build-log-${{ github.run_number }}
          path: electron_manager/build-windows-runtime.log
          if-no-files-found: warn
          retention-days: 14

      - name: Annotate bundled runtime build failure
        if: failure()
        shell: pwsh
        run: |
          if (Test-Path build-windows-runtime.log) {
            $log = Get-Content -Raw build-windows-runtime.log
            $tail = if ($log.Length -gt 3500) { $log.Substring($log.Length - 3500) } else { $log }
            $escaped = $tail.Replace("%", "%25").Replace("`r", "%0D").Replace("`n", "%0A")
            Write-Host "::error title=Bundled runtime build log::$escaped"
          }

      - name: Package Windows 10/11 installer
        id: package-modern
        continue-on-error: true
        shell: pwsh
        run: |
          npm run package:win *>&1 | Tee-Object -FilePath package-windows-10-11.log
          exit $LASTEXITCODE

      - name: Upload Windows 10/11 packaging log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bs-manager-windows-10-11-package-log-${{ github.run_number }}
          path: electron_manager/package-windows-10-11.log
          if-no-files-found: warn
          retention-days: 14

      - name: Stop when Windows 10/11 packaging fails
        if: steps.package-modern.outcome == 'failure'
        shell: pwsh
        run: exit 1

      - name: Upload Windows 10/11 release
        uses: actions/upload-artifact@v4
        with:
          name: bs-manager-windows-10-11-x64-${{ github.run_number }}
          path: |
            electron_manager/release/*.exe
          if-no-files-found: error
          retention-days: 14

      - name: Set up legacy Python for Windows 7
        uses: actions/setup-python@v5
        with:
          python-version: "3.8"
          architecture: x64

      - name: Build Windows 7 legacy automation runtime
        shell: pwsh
        run: |
          Set-ExecutionPolicy -ExecutionPolicy Bypass -Scope Process -Force
          ./scripts/build_windows_runtime.ps1 -Python python -Windows7Legacy -OutputDirectory vendor/windows/win7-x64

      - name: Smoke test Windows 7 legacy automation runtime
        shell: pwsh
        run: |
          ./vendor/windows/win7-x64/adb_bot.exe --help
          ./vendor/windows/win7-x64/record_touch.exe --help
          ./vendor/windows/win7-x64/adb.exe version

      - name: Package Windows 7 SP1 x64 legacy installer
        run: npm run package:win7

      - name: List legacy release files
        shell: pwsh
        run: Get-ChildItem -Recurse release/win7-legacy | Select-Object FullName, Length

      - name: Upload Windows 7 legacy release
        uses: actions/upload-artifact@v4
        with:
          name: bs-manager-windows-7-x64-legacy-${{ github.run_number }}
          path: |
            electron_manager/release/win7-legacy/*.exe
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const tag = context.ref.replace('refs/tags/', '');
            const root = path.join(process.env.GITHUB_WORKSPACE, 'electron_manager', 'release');
            const files = [];
            const visit = (directory) => {
              for (const entry of fs.readdirSync(directory, { withFileTypes: true })) {
                const file = path.join(directory, entry.name);
                if (entry.isDirectory()) visit(file);
                else if (/\.(exe|yml|blockmap)$/i.test(entry.name)) files.push(file);
              }
            };
            visit(root);
            if (!files.length) throw new Error('No Windows release files found');

            let release;
            try {
              release = (await github.rest.repos.getReleaseByTag({ owner: context.repo.owner, repo: context.repo.repo, tag })).data;
            } catch (error) {
              if (error.status !== 404) throw error;
              release = (await github.rest.repos.createRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag_name: tag,
                name: tag,
                generate_release_notes: true,
                draft: false,
                prerelease: false,
              })).data;
            }

            const existing = await github.paginate(github.rest.repos.listReleaseAssets, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: release.id,
              per_page: 100,
            });
            for (const asset of existing) {
              if (files.some((file) => path.basename(file) === asset.name)) {
                await github.rest.repos.deleteReleaseAsset({ owner: context.repo.owner, repo: context.repo.repo, asset_id: asset.id });
              }
            }

            const contentType = (file) => file.endsWith('.exe') ? 'application/vnd.microsoft.portable-executable' : file.endsWith('.yml') ? 'text/yaml' : 'application/octet-stream';
            for (const file of files) {
              const name = path.basename(file);
              core.info(`Uploading ${name}`);
              await github.rest.repos.uploadReleaseAsset({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: release.id,
                name,
                data: fs.readFileSync(file),
                headers: { 'content-type': contentType(name), 'content-length': fs.statSync(file).size },
              });
            }
