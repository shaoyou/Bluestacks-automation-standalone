name: Package Windows Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package-windows-x64:
    name: Windows x64 package
    runs-on: windows-latest
    defaults:
      run:
        working-directory: electron_manager

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: electron_manager/package-lock.json

      - name: Install Electron dependencies
        run: npm ci

      - name: Package Windows installer
        id: package-modern
        continue-on-error: true
        shell: pwsh
        run: |
          npm run package:win *>&1 | Tee-Object -FilePath package-windows-10-11.log
          exit $LASTEXITCODE

      - name: Upload Windows packaging log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bs-manager-windows-package-log-${{ github.run_number }}
          path: electron_manager/package-windows-10-11.log
          if-no-files-found: warn
          retention-days: 14

      - name: Stop when Windows packaging fails
        if: steps.package-modern.outcome == 'failure'
        shell: pwsh
        run: exit 1

      - name: Upload Windows release
        uses: actions/upload-artifact@v4
        with:
          name: bs-manager-windows-x64-${{ github.run_number }}
          path: electron_manager/release/*.exe
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            electron_manager/release/*.exe
            electron_manager/release/*.yml
            electron_manager/release/*.blockmap
